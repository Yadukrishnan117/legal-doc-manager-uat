function simpleForm(a){formAction=a;const r=current();let titles={confirm:'Record client confirmation · v'+r.shared,changes:'Submit client-requested changes',approve:'Separate internal approval · v'+r.v,dispatch:'Dispatch final v'+r.released,receive:'Signed original received at office',verify:'Legal verification & closure',comment:'Add Legal comment'};let body={confirm:input('Evidence reference (email / signed confirmation)','evidence')+input('Confirmation date','date','date',new Date().toISOString().slice(0,10)),changes:'<label>Requested changes<textarea name="text" required rows="4"></textarea></label>',approve:input('Approver name / approval reference','evidence'),dispatch:input('Dispatch method','method')+input('Tracking / hand-delivery reference','tracking')+input('Destination / signatory','destination')+input('Dispatch date','date','date',new Date().toISOString().slice(0,10)),receive:input('Original received date','date','date',new Date().toISOString().slice(0,10))+input('Scan filename (demo filename only)','scan','file')+input('Physical custody location','location'),verify:`<div class="notice warn">Signed-original receipt alone does not close the agreement.</div><label><input type="checkbox" name="version" required> Returned original matches released final v${r.released}</label><label><input type="checkbox" name="signatures" required> All required parties have signed</label><label><input type="checkbox" name="custody" required> Scan and physical custody evidence verified</label>${input('Verification note / signature checks','note')}`,comment:'<label>Comment<textarea name="text" rows="4" required></textarea></label>'};modal(titles[a],`<div class="fields">${body[a]}</div>`,a==='verify'?'Verify & close agreement':undefined)}
function handleForm(f){const r=current(),get=n=>String(f.get(n)||'').trim();if(formAction==='request'){createRequest(f);return}if(formAction==='config'){state.config={name:get('name'),environment:get('environment'),source:get('source')};save();$('#modal').close();render();toast('Demo settings saved. Connector remains disconnected.');return}if(formAction==='mapping'){for(const k of Object.keys(state.mapping))state.mapping[k]=get(k);save();$('#modal').close();render();return}if(formAction==='confirm'&&role==='Sales'&&r.sent===r.shared&&!r.released&&r.stage!=='Changes Requested'){r.confirmed=r.shared;r.evidence=get('evidence')+' · '+get('date');r.stage='Client Confirmed';log(r,'Client confirmed exact v'+r.shared+' · '+r.evidence);event('client.confirmed',r)}else if(formAction==='changes'&&role==='Sales'&&r.sent===r.shared&&!r.released){r.changes.push(get('text'));r.confirmed=0;r.approved=0;r.stage='Changes Requested';log(r,'Client changes for v'+r.shared+': '+get('text'))}else if(formAction==='approve'&&role==='Legal'&&manager()&&r.confirmed===r.v){r.approved=r.v;log(r,'Internal approval recorded for v'+r.v+' · '+get('evidence'))}else if(formAction==='dispatch'&&role==='Operations'&&r.printed){r.dispatched=true;r.stage='Dispatched';r.dispatch=[get('method'),get('tracking'),get('destination'),get('date')].join(' · ');log(r,'Final v'+r.released+' dispatched · '+r.dispatch)}else if(formAction==='receive'&&role==='Operations'&&r.dispatched){const file=f.get('scan');if(!file?.name){toast('Select a scan filename for the demo.');return}r.received=true;r.stage='Signed Original Received';r.receipt=[get('date'),file.name,get('location')].join(' · ');log(r,'Signed original received at office · '+r.receipt+' · Legal verification required')}else if(formAction==='verify'&&role==='Legal'&&r.received&&r.dispatched&&r.confirmed===r.released&&r.approved===r.released&&f.get('version')&&f.get('signatures')&&f.get('custody')){r.stage='Legal Verification';log(r,'Legal verified exact final v'+r.released+', required signatures and custody · '+get('note'));r.stage='Fully Executed/Closed';log(r,'Fully Executed/Closed by Legal');event('agreement.executed',r)}else if(formAction==='comment'&&role==='Legal'){log(r,'Legal comment: '+get('text'))}else{toast('Prerequisites are not met.');return}save();$('#modal').close();render();toast('Demo record updated with actor and timestamp.')}
function requestForm(){if(['Auditor','Administrator'].includes(role))return;formAction='request';modal('New legal request',`<div class="notice">Reuse a master client across departments. New entries remain in this browser only.</div><div class="fields"><label>Client<select name="client" id="clientChoice" onchange="$('#newClientFields').hidden=this.value!=='new'">${state.clients.filter(c=>visible().some(r=>r.client===c.id)).map(c=>`<option value="${c.id}">${esc(c.name)} · ${c.id}</option>`).join('')}<option value="new">＋ Create new master client</option></select></label><label>Business department<select name="dept" onchange="$('#typeChoice').innerHTML=TYPES[this.value].map(t=>'&lt;option&gt;'+t+'&lt;/option&gt;').join('')">${(scopeDept==='All departments'?profile().departments:[scopeDept]).map(d=>`<option>${d}</option>`).join('')}</select></label><div id="newClientFields" class="full" hidden><div class="fields">${input('New client company','company','text','',false)}${input('Contact / email','contact','text','',false)}</div></div><label>Agreement type<select name="type" id="typeChoice">${TYPES[scopeDept==='All departments'?profile().departments[0]:scopeDept].map(t=>`<option>${t}</option>`).join('')}</select></label><label>Submitting team<select name="team">${['Sales','Operations','Accounts','Software','R&D'].map(t=>`<option ${t===profile().team?'selected':''}>${t}</option>`).join('')}</select></label>${input('Requester name','requester')}${input('Site / project','site')}<label>Priority<select name="priority"><option>Normal</option><option>High</option><option>Urgent</option></select></label>${input('Due date','due','date',new Date(Date.now()+4*86400000).toISOString().slice(0,10))}<label class="full">Request details<textarea name="details" required rows="3"></textarea></label>${input('Products / features / scope','scope')}${input('Revenue share %','share','number','0')}${input('Calculation basis and paying / receiving parties','basis')}${input('Per-unit amount','amount','number','0')}${input('Currency','currency','text','INR')}${input('Explicit unit (session, device, month…)','unit')}${input('Setup fee','setup','number','0')}${input('Maintenance fee','maintenance','number','0')}<label>Maintenance frequency<select name="frequency"><option>Monthly</option><option>Quarterly</option><option>Annual</option><option>One-time</option></select></label>${input('Supporting attachments (filenames only)','attachments','file','',false)}</div><p class="footer-note">CPP = Charge Point Partner Agreement. Category mapping is unconfirmed. Hardware types are configurable proposals.</p>`,'Create legal request');$('#dialogForm').querySelector('[name=share]').max=100;for(const n of ['share','amount','setup','maintenance']){$('#dialogForm').querySelector('[name='+n+']').min=0;$('#dialogForm').querySelector('[name='+n+']').step='any'}}
function createRequest(f){if(['Auditor','Administrator'].includes(role))return;const g=n=>String(f.get(n)||'').trim();if(!profile().departments.includes(g('dept'))){toast('Department is outside this preview profile.');return}let cid=g('client');if(cid==='new'){if(!g('company')||!g('contact')){toast('Enter new company and contact, or reuse an existing client.');return}cid='CL-'+String(Math.max(...state.clients.map(c=>Number(c.id.slice(3))))+1).padStart(6,'0');state.clients.push({id:cid,name:g('company'),contact:g('contact'),site:g('site'),project:g('site')})}let id=Math.max(...state.records.map(r=>r.id))+1;const r={id,client:cid,dept:g('dept'),type:g('type'),previewPersona:persona,team:role==='Legal'?g('team'):profile().team,requester:g('requester')+' · '+(role==='Legal'?g('team'):profile().team),owner:'Leena K.',created:iso(),due:g('due'),priority:g('priority'),stage:'Draft',v:1,shared:0,sent:0,confirmed:0,approved:0,released:0,changes:[],history:[]};for(const n of ['details','scope','share','basis','amount','currency','unit','setup','maintenance','frequency'])r[n]=g(n);r.site=g('site');const file=f.get('attachments');if(file?.name)r.details+=' · Attachment filename only: '+file.name;state.records.unshift(r);log(r,'Lead and legal request created by '+r.requester);$('#modal').close();openRecord(id);toast(ref(r)+' created in session-only demo state.')}
function clients(){return `<div class="heading"><div><div class="eyebrow">Shared identity</div><h1>Client directory</h1><p>One master client. Linked departments, requests, and agreements.</p></div><button class="primary" onclick="requestForm()">＋ New request</button></div><div class="panel table-wrap"><table><thead><tr><th>Master client</th><th>Contact</th><th>Site / project</th><th>Linked agreements</th></tr></thead><tbody>${state.clients.filter(c=>visible().some(r=>r.client===c.id)).map(c=>`<tr tabindex="0" onclick="selectedClient='${c.id}';page='Client';render()" onkeydown="if(event.key==='Enter'){selectedClient='${c.id}';page='Client';render()}"><td><strong>${esc(c.name)}</strong><small>${c.id}</small></td><td>${esc(c.contact)}</td><td>${esc(c.site)}<small>${esc(c.project)}</small></td><td>${visible().filter(r=>r.client===c.id).length} agreements →</td></tr>`).join('')}</tbody></table></div>`}let selectedClient='CL-000123';function clientDetail(){const c=state.clients.find(c=>c.id===selectedClient);return `<button onclick="navigate('Clients')">← Clients</button><h1 style="margin-top:20px">${esc(c.name)}</h1><p>${c.id} · ${esc(c.contact)}</p><div class="panel pad" style="margin:24px 0"><h3>${esc(c.site)}</h3><p>${esc(c.project)}</p><p>Fictional client · numbering conventions are illustrative.</p></div><h2 style="margin-bottom:18px">Linked requests & agreements</h2>${visible().filter(r=>r.client===c.id).map(r=>`<div class="doc row"><div><strong>${r.dept} · ${esc(r.type)}</strong><p>${depref(r)} · ${ref(r)} · ${agr(r)}</p></div><button onclick="openRecord(${r.id})">Open workspace →</button></div>`).join('')}`}
function integrations(){return `<div class="heading"><div><div class="eyebrow">Built around your in-house tools</div><h1>Integrations & automation</h1><p>A clear contract between Legal and your internal ERP products.</p></div><span class="tag amber">SIMULATION ONLY</span></div><div class="notice warn">No endpoint, authentication, API schema, or live connection has been configured. These controls make no network calls and accept no secrets.</div><div class="tabs">${['Connections','Field mapping','Automation rules','Event log'].map(t=>`<button class="${integrationTab===t?'active':''}" onclick="integrationTab='${t}';render()">${t}</button>`).join('')}</div>${integrationTab==='Connections'?`<div class="twocol"><div class="card connector"><div class="row"><div class="connection-icon">⇄</div>${badge('Disconnected')}</div><h2>${esc(state.config.name)}</h2><p>Custom internal ERP adapter</p><div class="detail-grid" style="margin:25px 0"><div><label>Environment</label><strong>${esc(state.config.environment)} · demo</strong></div><div><label>Source identifier</label><strong>${esc(state.config.source)}</strong></div><div><label>Inbound events</label><strong>lead.created · deal.closed</strong></div><div><label>Outbound events</label><strong>agreement.updated<br>client.confirmed · agreement.executed</strong></div></div><div class="row"><button onclick="configure()">Configure demo settings</button><button class="primary" onclick="simulateForm()">▷ Simulate inbound event</button></div></div><div class="panel pad"><div class="eyebrow">Integration readiness</div><h2 style="margin:8px 0 18px">Ready for your API contract</h2><div class="rule"><b>1</b><div><strong>Map identities</strong><p>ERP customer → master client → department reference.</p></div></div><div class="rule"><b>2</b><div><strong>Replay safely</strong><p>Source + external record + event ID prevent duplicate requests.</p></div></div><div class="rule"><b>3</b><div><strong>Observe every delivery</strong><p>Queue, retries, reconciliation, and a redacted audit trail.</p></div></div><p style="font-size:12px;margin-top:20px">A separate local backend now provides signed inbound event receipts and a durable outbox. The ERP mapping/delivery adapter is not yet connected.</p></div></div>`:integrationTab==='Field mapping'?`<div class="panel"><div class="panel-head row"><div><h2>Entity field mapping</h2><p>Illustrative paths; validate against your ERP schema.</p></div><button onclick="mappingForm()">Edit mapping</button></div><table><thead><tr><th>Source ERP field</th><th>Portal entity / field</th><th>Handling</th></tr></thead><tbody>${Object.entries(state.mapping).map(([k,v])=>`<tr><td><code>${esc(v)}</code></td><td>${{lead:'External lead reference',customer:'Master client external ID',site:'Site / project',deal:'External deal reference',commercial:'Agreement commercial terms',owner:'Assigned employee / team'}[k]}</td><td>Proposed · schema not connected</td></tr>`).join('')}</tbody></table></div>`:integrationTab==='Automation rules'?`<div class="panel pad"><h2>Proposed workflow rules</h2><p>Preview only · no scheduled jobs or external actions.</p>${[['Deal closed','Create legal ticket using mapped client identity','Simulation creates a session-only request'],['Legal explicitly shares an updated draft','Create a Sales task for the shared version','Unpublished revisions do not replace the Sales copy'],['Client confirms current version','Queue handoff after separate internal approval','Legal explicitly releases the approved final to Operations'],['Signed original received','Create Legal verification task','Never automatically close the agreement'],['Legal marks fully executed','Queue agreement.executed to internal ERP','Use exact agreement/version and original lead identity'],['Target or completion deadline reached','Escalate to Legal owner / manager','Calendar-day demo policy; lead clock persists through handoffs']].map((x,i)=>`<div class="rule"><b>${i+1}</b><div><strong>${x[0]} → ${x[1]}</strong><p>${x[2]}</p></div></div>`).join('')}</div>`:`<div class="panel"><div class="panel-head row"><div><h2>Integration event log</h2><p>Sample and locally simulated deliveries. No external system is contacted.</p></div><button onclick="simulateForm()">▷ Simulate event</button></div><div class="table-wrap"><table><thead><tr><th>Event / ID</th><th>Record</th><th>State</th><th>Time · IST</th><th>Action</th></tr></thead><tbody>${state.events.map((e,i)=>`<tr><td><strong>${esc(e.event)}</strong><small>${esc(e.id)}</small></td><td>${esc(e.record)}</td><td>${badge(e.state)}</td><td>${fmt(e.time)}</td><td>${e.state==='Retry pending'?`<button onclick="retryEvent(${i})">Simulate retry</button>`:'—'}</td></tr>`).join('')}</tbody></table></div></div>`}<div class="footer-note">Demo scope: session-only records and event ledger. Production target: Google Workspace sign-in and AWS Mumbai. Local development foundation uses Node.js + TypeScript, SQLite and private encrypted documents; PostgreSQL/S3 adapters are pending.</div>`}
function configure(){formAction='config';modal('Configure in-house ERP · demo',`<div class="notice">Non-secret settings only. No URL or credential is saved; this cannot establish a real connection.</div><div class="fields">${input('Display name','name','text',state.config.name)}${input('Source ERP identifier','source','text',state.config.source)}<label>Environment<select name="environment"><option>Sandbox</option><option>Development</option></select></label></div>`)}
function mappingForm(){formAction='mapping';modal('Edit proposed entity mappings',`<div class="fields">${Object.entries(state.mapping).map(([k,v])=>input(k+' source path',k,'text',v)).join('')}</div>`)}
function simulateForm(){modal('Simulate an inbound ERP event',`<div class="notice">Creates one local legal request using fictional data. Replay the same event to verify duplicate prevention.</div><div class="fields"><label>Incoming event<select name="event"><option>deal.closed</option><option>lead.created</option></select></label>${input('External record ID','external','text','ERP-DEAL-204')}${input('Event ID','eventId','text','erp-demo-204')}${'<div><label>Fixed demo identity mapping</label><p>ERP-CUSTOMER-123 → CL-000123</p></div>'}</div>`,'Run dry-run simulation');$('#dialogForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);simulate(String(f.get('event')),String(f.get('external')),String(f.get('eventId')));$('#modal').close();render()}}
function simulate(name,external,eid){const key=[state.config.source,external,eid].join('|');if(state.seen.includes(key)){toast('Duplicate event ignored. Existing ticket preserved.');return}state.seen.push(key);let r=state.records.find(r=>r.external===external&&r.source===state.config.source);if(r){log(r,'ERP simulation updated mapped lead '+external+' · '+eid)}else{r={...structuredClone(state.records[2]),id:Math.max(...state.records.map(r=>r.id))+1,client:'CL-000123',dept:'Software',created:iso(),due:new Date(Date.now()+state.policy.target*86400000).toISOString().slice(0,10),external,source:state.config.source,stage:'Draft',v:1,shared:0,sent:0,confirmed:0,approved:0,released:0,history:[],changes:[],details:'SIMULATED '+name+' from internal ERP. Validate mapped commercial terms before drafting.'};state.records.unshift(r);log(r,'Simulated '+name+' · '+external+' · reused master client CL-000123')}state.events.unshift({id:eid,event:name,record:ref(r),state:'Simulated delivered',time:iso()});save();toast('Dry run complete: '+ref(r)+'. No external calls.')}
function retryEvent(i){state.events[i].state='Simulated delivered';state.events[i].time=iso();save();render();toast('Retry simulated locally; no delivery occurred.')}
function settings(){return `<div class="eyebrow">Workspace policy · demo</div><h1>Settings & conventions</h1><p>Proposed defaults where business decisions remain open.</p><div class="twocol" style="margin-top:26px"><div class="panel pad"><h2>SLA policy</h2><p>Lead creation is the proposed start. Calendar vs working days remains unconfirmed.</p><form onsubmit="event.preventDefault();const f=new FormData(this);if(+f.get('limit')<+f.get('target')){toast('Completion limit must be at least the target.');return}state.policy={target:+f.get('target'),limit:+f.get('limit')};save();render();toast('Demo SLA policy updated.')"><div class="fields" style="margin:22px 0">${input('Target · calendar days','target','number',state.policy.target)}${input('Completion limit · calendar days','limit','number',state.policy.limit)}</div><p>Suggested target: 3–4 days. Maximum goal: within one week. Existing due dates remain explicit; Operations handoff never resets lead age.</p><button type="submit" class="primary" style="margin-top:16px">Save demo policy</button></form></div><div class="panel pad"><h2>Open business decisions</h2><p style="margin-top:18px">CPP means Charge Point Partner Agreement. The definitive mapping of CPP Agreement, CPP on Sale, and CPP on Operations needs confirmation.</p><p>Hardware agreement taxonomy, approval authority, signature sequence, numbering conventions and working-day policy are configurable proposals.</p><h3 style="margin-top:25px">Demo data controls</h3><p>Data is held in memory only and cleared on reload. This Site is a design preview. The separate runnable local application implements authentication, server RBAC and private encrypted documents; it is not connected to this preview.</p><button style="margin-top:18px" onclick="resetForm()">Reset demo workspace</button></div></div>`}
function accessPrivacy(){return `<div class="heading"><div><div class="eyebrow">Application foundation · 28 October 2026</div><h1>Clear access. Responsible handling.</h1><p>Legal Doc Manager by 72BPM · Charge Point workspace</p></div><span class="tag amber">WORKFLOW DEMO</span></div><div class="notice warn">This public demo is not the protected application. It has no verified India residency. Use fictional data only; all interactions here run in memory and reset on reload.</div><div class="twocol"><div class="panel pad"><h2>Role-based access model</h2><p>Implemented server-side in the separate local development foundation.</p><div class="table-wrap"><table><thead><tr><th>Role</th><th>Record scope</th><th>Responsibilities</th></tr></thead><tbody>${[['Legal Manager','Organization + permitted departments','Review archive, approve, release, verify/close; privacy and retention review'],['Legal staff','Assigned Legal records + department','Draft, share, release after manager approval; verify/close'],['Sales','Assigned / own requests','Assigned Sales sees only latest explicitly shared file; records client response'],['Operations','Assigned / own requests','Assigned Operations sees released final; print, dispatch and original receipt'],['Accounts / technical reviewer','Own requests + department','Submit and track requests; no document access or workflow approval'],['Administrator','Organization accounts','Activate/deactivate users; no automatic legal-record access'],['Read-only auditor','Permitted departments','Read scoped records, archive and authorized exports; no workflow changes']].map(x=>`<tr><td><strong>${x[0]}</strong></td><td>${x[1]}</td><td>${x[2]}</td></tr>`).join('')}</tbody></table></div><p class="footer-note">The role selector elsewhere on this Site remains a workflow preview. Production roles derive from a verified session and explicit provisioned account, never a browser field.</p></div><div class="stack"><div class="panel pad"><h2>Sign-in & hosting</h2><p><strong>Google Workspace</strong> is the selected identity provider. The local foundation validates signature, issuer, audience, nonce, expiry, verified email and approved hosted domain, then requires an explicitly provisioned Google subject.</p><p><strong>AWS Mumbai · ap-south-1</strong> is the selected deployment region for database, private documents, backups and security logs. AWS resources and production adapters are not yet provisioned.</p><p>Approved Workspace domain: chargemod.com. OAuth client credentials and AWS resources remain unconfigured. No real ERP is connected.</p></div><div class="panel pad"><h2>Privacy operations</h2><p>The local application includes authenticated access/correction/erasure/grievance intake, Legal review, purpose/basis metadata, legal holds and deletion proposals. Erasure never automatically destroys a contract.</p><p>No Aadhaar/government ID collection. Uploaded files are limited to 2 MB PDF/TXT in local development. Production malware scanning, retention operations, key management and a public grievance contact need approval/configuration.</p></div></div></div><div class="panel pad" style="margin-top:22px"><h2>Privacy & acceptable-use drafts</h2><p><span class="tag amber">Awaiting company legal approval</span></p><p>Use the workspace only for authorized agreement preparation, negotiation, execution and security. Minimize business contact details and share documents only through approved channels. Use individual accounts; do not impersonate client confirmation, upload malware, bypass access checks, or include unrelated personal information.</p><p>Charge Point's legal entity details, privacy/grievance contact, lawful processing rationale, recipients/processors, retention schedules, identity-verification process and individual-rights response procedure must be completed before real personal data goes live. Consent is not assumed to be the only lawful basis.</p><p>India’s DPDP framework is phased; current IT Act/SPDI/CERT-In obligations and upcoming DPDP requirements need company-specific review. This is not a compliance certificate or approved legal notice. Mumbai hosting is the selected company deployment policy; this Site does not prove that policy.</p><p class="footer-note">Verified references: <a href="https://www.meity.gov.in/static/uploads/2025/11/c56ceae6c383460ca69577428d36828b.pdf">DPDP commencement</a> · <a href="https://www.meity.gov.in/static/uploads/2025/11/53450e6e5dc0bfa85ebd78686cadad39.pdf">Rules 2025</a> · <a href="https://www.meity.gov.in/static/uploads/2025/12/3c7ebbae0e5456f493f486e6845df86b.pdf">Corrigendum</a> · <a href="https://www.cert-in.org.in/Directions70B.jsp">CERT-In directions</a></p></div>`}
function resetForm(){modal('Reset this browser’s demo?',`<p>This removes locally created requests, comments and simulation settings and restores the fictional sample records.</p>`,'Reset demo');$('#dialogForm').onsubmit=e=>{e.preventDefault();state=initial();save();$('#modal').close();navigate('Overview');toast('Demo workspace reset.')}}
