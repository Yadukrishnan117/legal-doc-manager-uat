name: Build UAT application image
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: uat-image
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:all
      - run: npm audit --omit=dev --audit-level=high
  package:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Authenticate to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and publish versioned UAT image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build -f Dockerfile.uat --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" -t "$image:uat-$GITHUB_SHA" .
          docker push "$image:uat-$GITHUB_SHA"
          printf '### UAT image\n`%s:uat-%s`\n\nThis is an image artifact; a running UAT environment must be provisioned separately.\n' "$image" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Sign out of registry
        if: always()
        run: docker logout ghcr.io
