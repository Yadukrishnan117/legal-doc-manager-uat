name: Application security checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:all
      - run: npm audit --omit=dev --audit-level=high

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.uat -t legal-doc-manager:uat-check .
      - name: Verify container startup within the UAT memory limit
        shell: bash
        run: |
          docker run -d --name uat-check --memory=950m --memory-swap=950m --cpus=1 -p 127.0.0.1:8788:8788 \
            -v uat-check-data:/data \
            -e NODE_ENV=production -e LDM_ENV=uat -e UAT_FICTIONAL_DATA_ONLY=1 \
            -e LDM_RUNTIME=/data/ldm -e APP_ORIGIN=https://uat.example.invalid \
            -e PORT=8788 -e LDM_DATA_KEY="$(openssl rand -base64 32)" \
            -e LDM_BOOTSTRAP_PASSWORD="$(openssl rand -base64 24)" \
            legal-doc-manager:uat-check
          trap 'docker logs uat-check; docker rm -f uat-check; docker volume rm uat-check-data' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent -H 'Host: healthcheck.railway.app' http://127.0.0.1:8788/health/ready; then
              exit 0
            fi
            sleep 2
          done
          docker inspect --format '{{json .State}}' uat-check
          exit 1
